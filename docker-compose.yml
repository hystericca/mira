name: mira-web

services:
  web:
    build:
      context: .
      dockerfile: deploy/dokploy/Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
